<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KineTrace · Video search</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #183337;
        --muted: #586f71;
        --line: #d6e1df;
        --accent: #126653;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none!important;
      }

      body {
        margin: 0;
        background: #f4f7f5;
        color: var(--ink);
        font: 16px/1.55 "Inter",system-ui,sans-serif;
      }

      main {
        max-width: 1200px;
        margin: auto;
        padding: 40px 24px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }

      h1 {
        font-size: 32px;
        letter-spacing: -1px;
        margin: 0;
      }

      h2 {
        font-size: 20px;
      }

      p {
        color: var(--muted);
      }

      form {
        background: white;
        border: 1px solid var(--line);
        padding: 24px;
        border-radius: 12px;
        margin: 28px 0;
      }

      label {
        display: block;
        font-weight: 600;
      }

      input {
        font: inherit;
        width: 100%;
        border: 1px solid #a8bfba;
        border-radius: 6px;
        padding: 12px;
        margin: 8px 0 16px;
      }

      button {
        font: inherit;
        background: var(--accent);
        color: white;
        border: 0;
        padding: 11px 20px;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        opacity: .5;
        cursor: wait;
      }

      button.secondary {
        background: #e6eeeb;
        color: var(--ink);
      }

      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin: 12px 0;
      }

      .card p {
        font-size: 14px;
        margin: 8px 0 0;
      }

      .card h3 {
        font-size: 16px;
        margin: 0 0 10px;
      }

      video {
        width: 100%;
        aspect-ratio: 16/9;
        background: #15272b;
        border-radius: 6px;
      }

      #status {
        min-height: 24px;
      }

      #recommendation {
        max-width: 560px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }

      .note {
        font-size: 14px;
      }

      @media(max-width:650px) {
        main {
          padding: 24px 16px;
        }

        .columns {
          grid-template-columns: 1fr;
        }

        header {
          align-items: start;
          flex-direction: column;
        }

      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>KineTrace</h1>
        <span id="ready" role="status">Checking service…</span>
      </header>
      <p>Find a video by describing its scene and actions.</p>

      <form id="search-form">
        <label for="query">Video description</label>
        <input
          id="query"
          required
          maxlength="4096"
          placeholder="A person throws a ball and runs across a field."
        >
        <details>
          <summary>Retrieval options</summary>
          <label for="translation">English retrieval text (optional)</label>
          <input
            id="translation"
            maxlength="4096"
            placeholder="Use an English translation for CLIP when needed."
          >
        </details>
        <button id="search-button">Search videos</button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>

      <section id="recommendation" hidden>
        <h2>Suggested video</h2>
        <div id="suggested-card"></div>
        <p class="note">Rate this video against your description. Leave it unrated if evidence is insufficient.</p>
        <div class="actions">
          <button type="button" data-reward="1">Matches</button>
          <button type="button" class="secondary" data-reward="0">Does not match</button>
        </div>
        <p id="feedback-status" role="status"></p>
      </section>

      <div class="columns" id="results" hidden>
        <section>
          <h2>CLIP retrieval</h2>
          <div id="retrieval"></div>
        </section>
        <section>
          <h2>Qwen reranking</h2>
          <div id="reranked"></div>
        </section>
      </div>
    </main>

    <script>
      let eventId = null;

      function card(candidate, rank) {
        const article = document.createElement('article');
        article.className = 'card';
        const title = document.createElement('h3');
        title.textContent = `${rank}. ${candidate.video_id}`;
        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'none';
        video.src = candidate.video_url;
        const detail = document.createElement('p');
        const score = candidate.rerank_score;
        detail.textContent = `CLIP rank ${candidate.retrieval_rank} · score ${candidate.retrieval_score.toFixed(3)}` +
          (score === undefined ? '' : ` · Qwen ${score.toFixed(3)}`);
        article.append(title, video, detail);
        return article;
      }

      async function jsonResponse(response) {
        const body = await response.json();
        if (!response.ok) {
          throw new Error(
            typeof body.detail === 'string' ? body.detail : `Request failed (${response.status}).`
          );
        }
        return body;
      }

      fetch('readyz')
        .then(jsonResponse)
        .then(body => {
          document.getElementById('ready').textContent = `Ready · ${body.model.videos} videos`;
        })
        .catch(error => {
          document.getElementById('ready').textContent = error.message;
        });

      document.getElementById('search-form').addEventListener('submit', async event => {
        event.preventDefault();
        const button = document.getElementById('search-button');
        const status = document.getElementById('status');
        button.disabled = true;
        document.querySelectorAll('video').forEach(video => video.pause());
        status.textContent = 'Searching and reranking…';
        document.getElementById('recommendation').hidden = true;
        document.getElementById('results').hidden = true;
        eventId = null;
        const payload = {
          query: document.getElementById('query').value,
          retrieval_k: 20,
          rerank_k: 5
        };
        const translation = document.getElementById('translation').value.trim();
        if (translation) {
          payload.retrieval_text = translation;
        }
        try {
          const body = await fetch('search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          }).then(jsonResponse);
          for (const [name, rows] of [['retrieval', body.retrieval], ['reranked', body.candidates]]) {
            const container = document.getElementById(name);
            container.replaceChildren(...rows.slice(0, 5).map((candidate, i) => card(candidate, i + 1)));
            // Relative URLs also work behind a Jupyter port proxy.
            for (const video of container.querySelectorAll('video')) {
              video.src = video.getAttribute('src').replace(/^\//, '');
            }
          }
          document.getElementById('results').hidden = false;
          status.textContent = `${body.timings_ms.total.toFixed(0)} ms pipeline time` +
            (body.fallback ? ` · Showing CLIP fallback (${body.fallback_reason}).` : '');
          if (body.recommendation) {
            eventId = body.recommendation.event_id;
            const candidate = body.recommendation.candidate;
            const item = card(candidate, 1);
            item.querySelector('video').src = candidate.video_url.replace(/^\//, '');
            document.getElementById('suggested-card').replaceChildren(item);
            document.getElementById('recommendation').hidden = false;
            document.getElementById('feedback-status').textContent = '';
            document.querySelectorAll('[data-reward]').forEach(b => {
              b.disabled = false;
            });
          }
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      document.querySelectorAll('[data-reward]').forEach(button => button.addEventListener('click', async () => {
        if (!eventId) {
          return;
        }
        const feedbackEventId = eventId;
        const buttons = document.querySelectorAll('[data-reward]');
        buttons.forEach(b => {
          b.disabled = true;
        });
        try {
          await fetch('feedback', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              event_id: feedbackEventId,
              reward: Number(button.dataset.reward)
            })
          }).then(jsonResponse);
          if (eventId !== feedbackEventId) {
            return;
          }
          document.getElementById('feedback-status').textContent = 'Feedback saved.';
        } catch (error) {
          if (eventId !== feedbackEventId) {
            return;
          }
          document.getElementById('feedback-status').textContent = error.message;
          buttons.forEach(b => {
            b.disabled = false;
          });
        }
      }));
    </script>
  </body>
</html>
